# Ollama model routing and agent threshold configuration
# Edit this file to tune quality gates or point to a remote Ollama instance.

ollama:
  base_url: "http://localhost:11434"
  timeout_seconds: 120
  # Set to false to always run in rule-based mode (no LLM calls)
  enabled: true

models:
  # DeepSeek R1 32B — deep reasoning tasks (model evaluation, promotion gates)
  reasoning: "deepseek-r1:32b"
  # Qwen2.5-Coder 32B — code/data parsing tasks (data quality checks)
  coder: "qwen2.5-coder:32b"
  # Gemma2 27B — balanced narrative reasoning (sanity checks, explanations)
  narrative: "gemma2:27b"

# Fin-Eye API base URL (used by gas_sanity_agent and data_quality_checker)
fineye_api:
  base_url: "http://localhost:8000"
  timeout_seconds: 10

# Path to the model registry (relative to fin-eye project root)
model_registry_path: "backend/data/models/model_registry.jsonl"
model_artifacts_dir: "backend/data/models"

# ── ML Output Evaluator thresholds ───────────────────────────────────────────
ml_evaluation:
  # Minimum Sharpe ratio for a model to be considered deployable
  min_sharpe: 0.30
  # Minimum directional accuracy (must beat random = 50%)
  min_accuracy: 0.52
  # If ALL models in a training run have Sharpe below this, trigger FAIL not WARN
  hard_fail_sharpe: 0.0
  # Max allowed gap between train accuracy and validation accuracy (overfitting check)
  max_train_val_accuracy_gap: 0.15
  # Confidence distribution: if this % of predictions fall within ±3% of 50%, flag as low conviction
  low_conviction_threshold: 0.65

# ── Data Quality thresholds ───────────────────────────────────────────────────
data_quality:
  # Max allowed single-bar price gap as a fraction (0.20 = 20%)
  max_price_gap_pct: 0.20
  # Max consecutive bars with volume = 0 before flagging
  max_zero_volume_bars: 3
  # Macro data staleness limits in days (per indicator)
  macro_staleness_days:
    vix: 1
    fed_funds_rate: 7
    yield_spread_10y_2y: 1
    cpi_yoy: 35
    unemployment_rate: 35
    nonfarm_payrolls_mom: 35
    industrial_production_yoy: 35
  # Sentiment: if this fraction of articles score the same direction, flag as suspicious
  sentiment_concentration_threshold: 0.90
  # Minimum number of OHLCV bars required before a training run is allowed
  min_ohlcv_bars_for_training: 200

# ── GAS Sanity thresholds ─────────────────────────────────────────────────────
gas_sanity:
  # Max GAS point movement between two consecutive snapshots before flagging
  max_single_cycle_gas_movement: 15.0
  # Max allowed divergence between macro score direction and GAS direction
  # e.g. if macro dropped 20pts but GAS rose 10pts, that is suspicious
  max_component_divergence: 25.0
  # If technical and sentiment disagree by more than this, add a WARN
  component_disagreement_threshold: 40.0

# ── CI/CD Model Gate thresholds ───────────────────────────────────────────────
model_gate:
  # Challenger must be within this Sharpe delta of champion to be promoted
  # Negative value means challenger can be slightly worse and still promote
  # (useful when champion is very old — some regression is acceptable)
  min_sharpe_delta: -0.05
  # Challenger must be within this accuracy delta
  min_accuracy_delta: -0.02
  # Challenger max drawdown must not exceed champion's by more than this multiplier
  max_drawdown_multiplier: 2.0
  # Backup old champion before promoting (always recommended)
  backup_champion: true
  backup_suffix: ".champion_backup"

# ── Default symbols list ──────────────────────────────────────────────────────
default_symbols:
  - "AAPL"
  - "MSFT"
  - "TSLA"
  - "NVDA"
  - "AMZN"
  - "GOOGL"
  - "META"
  - "SPY"
  - "QQQ"
