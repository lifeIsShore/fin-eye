# Ollama model routing and agent threshold configuration
# Edit this file to tune quality gates or point to a remote Ollama instance.

ollama:
  base_url: "http://localhost:11434"
  timeout_seconds: 360
  # Set to false to always run in rule-based mode (no LLM calls)
  enabled: true

models:
  # DeepSeek R1 32B — deep reasoning tasks (model evaluation, promotion gates)
  reasoning: "deepseek-r1:32b"
  # Qwen2.5-Coder 32B — code/data parsing tasks (data quality checks)
  coder: "qwen2.5-coder:32b"
  # Gemma2 27B — balanced narrative reasoning (sanity checks, explanations)
  narrative: "gemma2:27b"

# Fin-Eye API base URL (used by gas_sanity_agent and data_quality_checker)
fineye_api:
  base_url: "http://localhost:8000"
  timeout_seconds: 100

# Path to the model registry (relative to fin-eye project root)
model_registry_path: "backend/data/models/model_registry.jsonl"
model_artifacts_dir: "backend/data/models"

# ── ML Output Evaluator thresholds ───────────────────────────────────────────
# All values used by inspect_models.py, ml_output_evaluator.py, cicd_model_gate.py
ml_evaluation:

  # ── Sharpe ───────────────────────────────────────────────────────────────
  # Below min_sharpe → FAIL (no deployable edge)
  min_sharpe: 0.30
  # Above max_sharpe → WARN (likely noise or tiny validation set)
  max_sharpe: 5.0
  # All models below this → hard FAIL regardless of other metrics
  hard_fail_sharpe: 0.0

  # ── Sharpe tier scale (informational — not configurable, just documented) ─
  # < 0.0   FAIL  — destroys value
  # 0.0–0.3 FAIL  — no edge
  # 0.3–0.5 ★     MARGINAL  — weak signal
  # 0.5–1.0 ★★    ACCEPTABLE
  # 1.0–2.0 ★★★   GOOD
  # 2.0–5.0 ★★★★  STRONG  (verify not overfitted)
  # > 5.0   ?     SUSPICIOUS

  # ── Accuracy ─────────────────────────────────────────────────────────────
  # Below 50% → FAIL (anti-predictive / worse than random)
  # Below min_accuracy → WARN
  min_accuracy: 0.52

  # ── Min trades (validation set size) ─────────────────────────────────────
  # Below 50     → FAIL (statistically meaningless)
  # Below min_trades → WARN (noisy estimates)
  min_trades: 200

  # ── Max drawdown (estimated from Sharpe proxy) ───────────────────────────
  # Above max_drawdown_pct → WARN
  max_drawdown_pct: 25.0

  # ── Profit factor (estimated proxy from accuracy + total_return) ─────────
  # Below min_profit_factor → WARN
  # Profit factor = gross wins / gross losses. Must exceed 1.0 to be profitable.
  min_profit_factor: 1.1

  # ── Overfitting check ─────────────────────────────────────────────────────
  # Max allowed gap between train accuracy and validation accuracy
  max_train_val_accuracy_gap: 0.15
  # If this fraction of predictions cluster near 50%, flag as low conviction
  low_conviction_threshold: 0.65

# ── Data Quality thresholds ───────────────────────────────────────────────────
data_quality:
  max_price_gap_pct: 0.20
  max_zero_volume_bars: 3
  macro_staleness_days:
    vix: 1
    fed_funds_rate: 7
    yield_spread_10y_2y: 1
    cpi_yoy: 35
    unemployment_rate: 35
    nonfarm_payrolls_mom: 35
    industrial_production_yoy: 35
  sentiment_concentration_threshold: 0.90
  min_ohlcv_bars_for_training: 200

# ── GAS Sanity thresholds ─────────────────────────────────────────────────────
gas_sanity:
  max_single_cycle_gas_movement: 15.0
  max_component_divergence: 25.0
  component_disagreement_threshold: 40.0

# ── CI/CD Model Gate thresholds ───────────────────────────────────────────────
model_gate:
  min_sharpe_delta: -0.05
  min_accuracy_delta: -0.02
  max_drawdown_multiplier: 2.0
  backup_champion: true
  backup_suffix: ".champion_backup"

# ── Default symbols list ──────────────────────────────────────────────────────
default_symbols:
  - "AAPL"
  - "MSFT"
  - "TSLA"
  - "NVDA"
  - "AMZN"
  - "GOOGL"
  - "META"
  - "SPY"
  - "QQQ"
